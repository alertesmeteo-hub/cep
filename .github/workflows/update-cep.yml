name: Mise à jour CEP France

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: write

concurrency:
  group: update-cep-france
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Produire les cartes et les prévisions CEP
        id: build
        run: |
          python scripts/update_cep_france.py \
            --catalog config/communes-france.json \
            --output-dir build/national \
            --forecast-hours 240 \
            --current-metadata-url \
            "https://raw.githubusercontent.com/${{ github.repository }}/data/index.json"
          if test -f build/national/index.json; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle publication CEP complète à envoyer."
          fi

      - name: Vérifier la publication
        if: steps.build.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/national")
          index = json.loads((root / "index.json").read_text(encoding="utf-8"))
          maps = json.loads((root / "maps/index.json").read_text(encoding="utf-8"))
          assert index["status"] == "ok"
          assert index["coverage"]["communes"] == 34746
          assert index["coverage"]["departments"] == 96
          assert len(maps["layers"]) >= 8
          assert len(maps["steps"]) == 65
          assert (root / "departements/66.json").is_file()
          print(
              f"Validation OK : {len(maps['layers'])} cartes, "
              f"{len(maps['steps'])} échéances, "
              f"{index['coverage']['communes']} communes"
          )
          PY

      - name: Publier la branche data
        if: steps.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -a build/national/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          cd "$publish_dir"
          git init -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Données CEP $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git"
          git push --force origin data
